name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Web build
        run: pnpm build:web && (cd apps/mobile/dist && zip -qr ../../../trailpack-web.zip .)
      - name: API build
        run: pnpm build:api && (cd apps/api && zip -qr ../../trailpack-api.zip dist Dockerfile README.md .env.example)
      - name: Android prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Android release build
        working-directory: apps/mobile/android
        env:
          TRAILPACK_UPLOAD_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          TRAILPACK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRAILPACK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRAILPACK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/trailpack-${GITHUB_REF_NAME}.apk
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab out/trailpack-${GITHUB_REF_NAME}.aab
          cp trailpack-web.zip trailpack-api.zip out/
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            TrailPack ${{ github.ref_name }}.
            APK is signed with the upload key when the ANDROID_KEYSTORE_* secrets are configured; otherwise with the Android debug key (installable for testing, not for Google Play).
